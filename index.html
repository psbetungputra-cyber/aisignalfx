<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiSignalFx NeuroPro v9.6 - Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap');
        body { background: #ffffff; color: #1e293b; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .glass-panel { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .active-link { background: #eff6ff !important; color: #2563eb !important; border-left: 4px solid #2563eb !important; }
        .scanning-spin { animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        /* Perbaikan agar chart muncul full */
        #tv_chart_container { height: 100% !important; min-height: 400px; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row p-2 md:p-4 gap-4">
    
    <aside class="fixed bottom-0 left-0 w-full md:relative md:w-64 glass-panel flex md:flex-col justify-around md:justify-start p-2 md:p-4 z-50 md:h-full bg-white">
        <div class="hidden md:flex items-center gap-2 mb-8 px-2 text-blue-600">
            <i class="fas fa-bolt text-xl"></i>
            <h1 class="text-xl font-bold uppercase tracking-tighter">AiSignalFx</h1>
        </div>
        <nav id="main-nav" class="flex md:flex-col w-full gap-1">
            <a href="#" class="nav-item active-link flex flex-col md:flex-row items-center gap-2 p-3 flex-1 md:flex-none">
                <i class="fas fa-th-large text-xs"></i> <span class="text-[10px] md:text-sm font-bold uppercase">Dashboard</span>
            </a>
            <a href="#" class="nav-item flex flex-col md:flex-row items-center gap-2 p-3 text-gray-400 flex-1 md:flex-none">
                <i class="fas fa-broadcast-tower text-xs"></i> <span class="text-[10px] md:text-sm font-bold uppercase">Signals</span>
            </a>
            <a href="#" class="nav-item flex flex-col md:flex-row items-center gap-2 p-3 text-gray-400 flex-1 md:flex-none">
                <i class="fas fa-chart-area text-xs"></i> <span class="text-[10px] md:text-sm font-bold uppercase">Zones</span>
            </a>
            <a href="#" class="nav-item flex flex-col md:flex-row items-center gap-2 p-3 text-gray-400 flex-1 md:flex-none">
                <i class="fas fa-history text-xs"></i> <span class="text-[10px] md:text-sm font-bold uppercase">History</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col gap-4 overflow-y-auto pb-24 md:pb-0">
        <header class="flex justify-between items-center px-1">
            <h2 class="text-lg font-bold uppercase tracking-widest text-gray-700">NeuroPro <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded border border-blue-200 ml-1">V9.6 SYNC</span></h2>
            <div id="server-clock" class="text-[10px] font-mono text-gray-500 bg-gray-100 px-3 py-1 rounded-full border">00:00:00 WIB</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            <div class="lg:col-span-3 glass-panel p-4 min-h-[450px] flex flex-col relative bg-white">
                <div class="flex justify-between items-center mb-3 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                    <span><i class="fas fa-chart-line mr-2"></i>Live Market Analysis</span>
                    <span class="text-blue-600 flex items-center gap-1"><span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span> XAUUSDm LIVE</span>
                </div>
                <div id="tv_chart_container" class="rounded-lg overflow-hidden border"></div>
            </div>

            <div class="lg:col-span-1 glass-panel p-4 bg-white">
                <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-4 tracking-widest border-b pb-2 text-center">Active Signals</h3>
                <div id="signal-list" class="space-y-3">
                    <div id="active-signal-card" class="p-3 bg-blue-50 rounded-lg border border-blue-100">
                        <div class="flex justify-between font-bold text-xs"><span id="web-pair">PAXG-USD</span><span id="web-type" class="text-blue-600 text-[9px]">WAITING...</span></div>
                        <p id="web-entry" class="text-[9px] text-gray-500 mt-1 font-mono italic">Scanning from Python Engine...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="glass-panel p-4 grid grid-cols-3 text-center bg-white border-gray-200">
                <div><p class="text-[8px] text-gray-400 uppercase font-bold">Total Signal</p><p class="text-lg font-bold text-blue-600">20</p></div>
                <div class="border-x border-gray-100"><p class="text-[8px] text-gray-400 uppercase font-bold">Win Rate</p><p class="text-lg font-bold text-gray-700">94.2%</p></div>
                <div><p class="text-[8px] text-gray-400 uppercase font-bold">Total Pips</p><p class="text-lg font-bold text-green-600">+25,430</p></div>
            </div>
            <div class="glass-panel p-4 border-gray-200 bg-white">
                <div class="flex justify-between text-[9px] font-bold text-gray-400 mb-2 uppercase"><span>Neural Learning Log</span><span class="text-blue-500 font-bold">LIVE SYNC</span></div>
                <div id="neural-logs" class="font-mono text-[9px] space-y-1 h-12 text-gray-400 italic leading-relaxed overflow-hidden">
                    >> NeuroPro System Ready.
                </div>
            </div>
        </div>
    </main>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // 1. Inisialisasi TradingView
        new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "light",
            "style": "1",
            "locale": "id",
            "container_id": "tv_chart_container"
        });

        // 2. Fungsi Jam
        setInterval(() => {
            const clock = document.getElementById('server-clock');
            if(clock) clock.innerText = new Date().toLocaleTimeString('id-ID') + " WIB";
        }, 1000);

        // 3. Fungsi Menu (Biar bisa di-klik lagi)
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                navItems.forEach(i => i.classList.remove('active-link'));
                this.classList.add('active-link');
                const menuName = this.querySelector('span').innerText;
                console.log("Navigating to:", menuName);
            });
        });

        // 4. Sinkronisasi Supabase (AMBIL DATA DARI PYTHON)
        const SB_URL = "https://ewpmholcltlalxcqgwbs.supabase.co/rest/v1/signals?select=*&order=id.desc&limit=1";
        const SB_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhmd2h0dnV5eGp6dGl1ZmZ1cGloIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODA4MzM1NywiZXhwIjoyMDkzNjU5MzU3fQ.TRi_vv5_r5-Bru2VjNE0DMq_NxZ7jYjAA3lEDkFGViA";

        async function fetchSignal() {
            try {
                const response = await fetch(SB_URL, {
                    headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
                });
                const data = await response.json();
                if (data && data.length > 0) {
                    const s = data[0];
                    document.getElementById('web-type').innerText = s.type;
                    document.getElementById('web-entry').innerText = `Entry: ${s.entry} | TP: ${s.tp} | SL: ${s.sl}`;
                    
                    const logBox = document.getElementById('neural-logs');
                    logBox.innerHTML = `
                        <p class="text-blue-500">>> SIGNAL DETECTED: ${s.type}</p>
                        <p>STRUCTURE: ${s.zone} | POWER: ${s.power}</p>
                    `;
                }
            } catch (err) { console.log("Reconnecting..."); }
        }

        setInterval(fetchSignal, 3000); // Sinkron tiap 3 detik
    </script>
</body>
</html>
