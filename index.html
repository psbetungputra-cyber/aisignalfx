<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI SIGNALFX PRO</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0e14; color: #e6edf3; font-family: -apple-system, sans-serif; margin: 0; padding: 0; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* Container Utama Full Screen */
        .container { background: #161b22; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; padding: 30px; }
        
        /* Header */
        h1 { font-size: 2.2rem; color: #8b949e; margin: 0; letter-spacing: 6px; font-weight: 900; }
        .time { font-size: 1.2rem; color: #8b949e; background: #21262d; padding: 8px 20px; border-radius: 30px; font-weight: bold; }
        
        /* Angka Harga Raksasa */
        .price-container { display: flex; align-items: center; justify-content: center; width: 100%; height: 35vh; }
        .price { font-size: 7.5rem; font-weight: 900; color: #58a6ff; text-shadow: 0 0 40px rgba(88,166,255,0.6); font-family: monospace; letter-spacing: -2px; }
        
        /* Box Signal Besar */
        .signal-box { width: 90%; padding: 45px 10px; border-radius: 30px; font-weight: 900; font-size: 4rem; text-align: center; background: #30363d; transition: 0.5s; }
        .buy { background: #238636 !important; box-shadow: 0 0 60px #238636; color: white; }
        .sell { background: #da3633 !important; box-shadow: 0 0 60px #da3633; color: white; }
        
        /* Detail SL/TP di Bawah */
        .details { width: 90%; display: flex; justify-content: space-between; border-top: 3px solid #30363d; padding-top: 30px; font-size: 2rem; font-weight: bold; }
        .sl { color: #ff7b72; text-shadow: 0 0 10px rgba(255,123,114,0.4); }
        .tp { color: #3fb950; text-shadow: 0 0 10px rgba(63,185,80,0.4); }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI SIGNALFX</h1>
        <div class="time" id="time">CONNECTING...</div>
        
        <div class="price-container">
            <div class="price" id="price">0.00</div>
        </div>
        
        <div id="signal" class="signal-box">SCANNING</div>
        
        <div class="details">
            <div class="sl">SL: <span id="sl">--</span></div>
            <div class="tp">TP: <span id="tp">--</span></div>
        </div>
    </div>
    <script>
        // INI KABEL DATANYA MANG, BIAR GAK UNDEFINED
        async function updateData() {
            try {
                // Ambil data dari 'mesin' /api/index yang kita buat tadi
                const r = await fetch('/api/index');
                const d = await r.json();
                
                // Tempel data ke layar, hilang deh 'undefined'-nya
                document.getElementById('price').innerText = d.price || "0.00";
                document.getElementById('time').innerText = (d.time || "--:--") + " WIB";
                document.getElementById('sl').innerText = d.sl || "--";
                document.getElementById('tp').innerText = d.tp || "--";
                
                // Ganti warna signal
                const s = document.getElementById('signal');
                const signal_text = d.signal ? String(d.signal).toUpperCase() : "SCANNING";
                s.innerText = signal_text;
                s.className = 'signal-box ' + (signal_text.includes('BUY') ? 'buy' : 'sell');
            } catch (e) { document.getElementById('price').innerText = "OFFLINE"; }
        }
        setInterval(updateData, 2000); // Update tiap 2 detik
        updateData(); // Jalankan langsung pas dibuka
    </script>
</body>
</html>
