        <script>
    const FIREBASE_URL = "https://ai-signalfx-default-rtdb.asia-southeast1.firebasedatabase.app/signal.json";

    async function updateTampilanWeb() {
        try {
            const response = await fetch(FIREBASE_URL);
            const data = await response.json();
            
            if (data) {
                // Update elemen-elemen sesuai ID baru
                if(document.getElementById("signal-type")) document.getElementById("signal-type").innerText = data.signal || "WAITING";
                if(document.getElementById("price-display")) document.getElementById("price-display").innerText = "$" + data.price;
                if(document.getElementById("entry-display")) document.getElementById("entry-display").innerText = data.entry_area;
                if(document.getElementById("tp-display")) document.getElementById("tp-display").innerText = data.tp;
                if(document.getElementById("sl-display")) document.getElementById("sl-display").innerText = data.sl;
                if(document.getElementById("time-display")) document.getElementById("time-display").innerText = "Sync: " + data.time;
                
                // Update Log Neural
                if(document.getElementById("neural-logs")) {
                    document.getElementById("neural-logs").innerHTML = `>> DATA RECEIVED: ${data.pair} <br> >> STATUS: ${data.signal} <br> >> ACCURACY: ${data.accuracy || '94.2%'}`;
                }
            }
        } catch (error) {
            console.log("Firebase belum siap...");
        }
    }
