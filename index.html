<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI SIGNALFX</title>
    <style>
        body { background: #0b0e14; color: #e6edf3; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .container { background: #161b22; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; padding: 20px; box-sizing: border-box; }
        h1 { font-size: 2rem; color: #8b949e; margin: 0; letter-spacing: 6px; font-weight: 900; }
        .price { font-size: 6rem; font-weight: bold; color: #58a6ff; text-shadow: 0 0 30px rgba(88,166,255,0.4); margin: 0; font-family: monospace; }
        .signal-box { width: 90%; padding: 40px 10px; border-radius: 25px; font-weight: 900; font-size: 3rem; text-align: center; background: #30363d; transition: 0.5s; }
        .buy { background: #238636 !important; box-shadow: 0 0 50px #238636; color: #fff; }
        .sell { background: #da3633 !important; box-shadow: 0 0 50px #da3633; color: #fff; }
        .details { width: 90%; display: flex; justify-content: space-between; border-top: 3px solid #30363d; padding-top: 20px; font-size: 1.8rem; font-weight: bold; }
        .time { font-size: 1.2rem; color: #8b949e; background: #21262d; padding: 8px 20px; border-radius: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI SIGNALFX</h1>
        <div class="time" id="time">MEMUAT...</div>
        <div class="price" id="price">0.00</div>
        <div id="signal" class="signal-box">SCANNING</div>
        <div class="details">
            <div style="color: #ff7b72;">SL: <span id="sl">0</span></div>
            <div style="color: #3fb950;">TP: <span id="tp">0</span></div>
        </div>
    </div>
    <script>
        async function updateData() {
            try {
                const res = await fetch('/api/index');
                const d = await res.json();
                document.getElementById('price').innerText = d.price;
                document.getElementById('time').innerText = d.time + " WIB";
                document.getElementById('sl').innerText = d.sl;
                document.getElementById('tp').innerText = d.tp;
                const s = document.getElementById('signal');
                s.innerText = d.signal;
                s.className = 'signal-box ' + (d.signal.includes('BUY') ? 'buy' : 'sell');
            } catch (e) { document.getElementById('price').innerText = "OFFLINE"; }
        }
        setInterval(updateData, 2000);
        updateData();
    </script>
</body>
</html>
