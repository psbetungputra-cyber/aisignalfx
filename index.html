<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiSignalFx - Light Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        :root {
            --bg-light: #ffffff;
            --panel-bg: #f8fafc;
            --accent-blue: #2563eb;
            --text-main: #1e293b;
        }
        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .active-tab {
            color: var(--accent-blue);
            border-bottom: 3px solid var(--accent-blue);
        }
    </style>
</head>
<body class="h-screen flex flex-col p-2 md:p-6 gap-4">

    <header class="flex justify-between items-center px-2">
        <h1 class="text-xl font-bold tracking-tight text-blue-600">AiSignalFx <span class="text-gray-400 font-normal">v9.5</span></h1>
        <div id="server-time" class="text-xs font-mono bg-gray-100 px-3 py-1 rounded-full text-gray-500 border border-gray-200">00:00:00</div>
    </header>

    <div class="flex-1 flex flex-col gap-4">
        <div class="glass-panel p-4 flex-1 flex flex-col relative min-h-[400px]">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-bold uppercase text-gray-400">Live Market Chart</span>
                <span class="text-xs text-blue-600 font-semibold">● PAXG-USD</span>
            </div>
            
            <div id="tradingview-chart" class="flex-1 w-full rounded-lg bg-white"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-panel p-4">
                <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-3">Recent Signal</h3>
                <div class="p-3 bg-blue-50 rounded-lg border border-blue-100">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm">PAXG-USD</span>
                        <span class="text-xs font-bold text-blue-600 uppercase">Strong Buy</span>
                    </div>
                </div>
            </div>
            
            <div class="glass-panel p-4">
                <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Neural Engine Log</h3>
                <div id="neural-logs" class="text-[10px] font-mono text-gray-500 space-y-1">
                    </div>
            </div>
        </div>
    </div>

    <nav class="glass-panel flex justify-around p-2">
        <a href="#" class="active-tab p-2 flex flex-col items-center gap-1">
            <i class="fas fa-chart-line"></i><span class="text-[10px] font-bold">DASHBOARD</span>
        </a>
        <a href="#" class="text-gray-400 p-2 flex flex-col items-center gap-1">
            <i class="fas fa-bullhorn"></i><span class="text-[10px] font-bold">SIGNALS</span>
        </a>
        <a href="#" class="text-gray-400 p-2 flex flex-col items-center gap-1">
            <i class="fas fa-history"></i><span class="text-[10px] font-bold">HISTORY</span>
        </a>
    </nav>

    <script>
        // 1. Jam
        setInterval(() => {
            document.getElementById('server-time').innerText = new Date().toLocaleTimeString('en-GB');
        }, 1000);

        // 2. Chart White Mode
        window.onload = () => {
            const container = document.getElementById('tradingview-chart');
            if(!container) return;

            const chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 380,
                layout: { 
                    backgroundColor: '#ffffff', 
                    textColor: '#64748b' 
                },
                grid: { 
                    vertLines: { color: '#f1f5f9' }, 
                    horzLines: { color: '#f1f5f9' } 
                },
                rightPriceScale: { borderColor: '#e2e8f0' },
                timeScale: { borderColor: '#e2e8f0' },
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#2563eb', 
                downColor: '#f43f5e', 
                borderVisible: false,
                wickUpColor: '#2563eb',
                wickDownColor: '#f43f5e',
            });

            candleSeries.setData([
                { time: '2026-05-01', open: 4640, high: 4645, low: 4638, close: 4642 },
                { time: '2026-05-02', open: 4642, high: 4648, low: 4640, close: 4646 },
                { time: '2026-05-03', open: 4646, high: 4647, low: 4642, close: 4643 },
                { time: '2026-05-04', open: 4643, high: 4650, low: 4643, close: 4648 },
                { time: '2026-05-05', open: 4648, high: 4655, low: 4647, close: 4652 }
            ]);

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth });
            });
        };

        // 3. Log
        const logs = ["Analyzing...", "Pattern found", "Winrate 94%"];
        setInterval(() => {
            const lb = document.getElementById('neural-logs');
            const p = document.createElement('p');
            p.innerText = ">> " + logs[Math.floor(Math.random()*logs.length)];
            lb.appendChild(p);
            if(lb.children.length > 3) lb.removeChild(lb.children[0]);
        }, 3000);
    </script>
</body>
</html>
