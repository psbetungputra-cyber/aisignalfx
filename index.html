<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiSignalFx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: rgba(22, 27, 34, 0.7);
            --accent-cyan: #00f2ff;
            --accent-gold: #c5a059;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .active-tab {
            border-left: 3px solid var(--accent-cyan);
            background: linear-gradient(90deg, rgba(0, 242, 255, 0.1) 0%, transparent 100%);
            color: var(--accent-cyan);
        }

        /* Animasi Scanner */
        .scanning-spin {
            animation: spin 2s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row p-2 md:p-4 gap-4">

    <aside class="fixed bottom-0 left-0 w-full md:relative md:w-64 glass-panel flex md:flex-col justify-around md:justify-start p-4 z-50 md:h-full">
        <div class="hidden md:flex items-center gap-2 mb-8 px-2">
            <i class="fas fa-bolt text-cyan-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-tight">AiSignalFx</h1>
        </div>

        <nav class="flex md:flex-col w-full gap-2 text-gray-400">
            <a href="#" class="flex flex-col md:flex-row items-center gap-3 p-3 active-tab flex-1 md:flex-none justify-center md:justify-start">
                <i class="fas fa-th-large"></i> <span class="text-xs md:text-sm">DASHBOARD</span>
            </a>
            <a href="#" class="flex flex-col md:flex-row items-center gap-3 p-3 hover:text-white flex-1 md:flex-none justify-center md:justify-start">
                <i class="fas fa-broadcast-tower"></i> <span class="text-xs md:text-sm">SIGNALS</span>
            </a>
            <a href="#" class="flex flex-col md:flex-row items-center gap-3 p-3 hover:text-white flex-1 md:flex-none justify-center md:justify-start">
                <i class="fas fa-chart-area"></i> <span class="text-xs md:text-sm">ZONES</span>
            </a>
            <a href="#" class="flex flex-col md:flex-row items-center gap-3 p-3 hover:text-white flex-1 md:flex-none justify-center md:justify-start">
                <i class="fas fa-history"></i> <span class="text-xs md:text-sm text-center">HISTORY</span>
            </a>
        </nav>

        <div class="hidden md:block mt-auto pt-4 border-t border-gray-800">
            <button class="w-full glass-panel p-3 text-sm flex items-center justify-center gap-2 text-yellow-500 border-yellow-500/30">
                <i class="fas fa-crown"></i> VIP UPGRADE
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col gap-4 overflow-y-auto pb-24 md:pb-0">
        
        <header class="flex justify-between items-center px-2">
            <div class="flex items-center gap-3">
                <h2 class="text-lg md:text-2xl font-bold">AiSignalFx NeuroPro <span class="text-xs bg-cyan-900/50 text-cyan-400 px-2 py-0.5 rounded border border-cyan-400/30">v9.5 FINAL</span></h2>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-[10px] text-gray-500">Server Time</p>
                <p class="text-xs font-mono" id="server-time">00:00:00 MDT</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 h-full">
            
            <div class="lg:col-span-3 glass-panel p-4 flex flex-col min-h-[400px]">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-semibold text-gray-400">LIVE CHART</span>
                    <div class="flex gap-2">
                         <span class="bg-green-500/20 text-green-400 text-[10px] px-2 py-1 rounded-full flex items-center gap-1">
                             <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Live
                         </span>
                    </div>
                </div>
                <div class="flex-1 w-full bg-black/20 rounded-lg flex items-center justify-center border border-white/5 relative overflow-hidden">
                    <p class="text-gray-600 text-sm italic">Loading Chart Engine...</p>
                    
                    <div class="absolute bottom-10 right-10 glass-panel p-4 w-48 border border-cyan-500/30">
                        <p class="text-[10px] text-gray-500 mb-2 uppercase tracking-widest">Scan Status</p>
                        <div class="flex items-center gap-3">
                            <i class="fas fa-circle-notch scanning-spin text-cyan-400"></i>
                            <p class="text-[10px]">Liquidity Void scanning...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1 flex flex-col gap-4">
                <div class="glass-panel p-4 flex-1">
                    <h3 class="text-xs font-bold mb-4 text-gray-400">RECENT SIGNALS</h3>
                    <div class="space-y-3">
                        <div class="p-3 bg-white/5 rounded-lg border-l-4 border-green-500">
                            <div class="flex justify-between text-xs mb-1">
                                <span class="font-bold">PAXG-USD</span>
                                <span class="text-green-400 font-bold uppercase">Strong Buy</span>
                            </div>
                            <p class="text-[10px] text-gray-400">Entry: 4643.00 - 4644.00</p>
                        </div>
                        </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Real-time Clock
        function updateTime() {
            const now = new Date();
            document.getElementById('server-time').innerText = now.toLocaleTimeString('en-GB') + " MDT";
        }
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
