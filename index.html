<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiSignalFx v10.5 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { background: #ffffff; color: #1e293b; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .glass-panel { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; }
        .active-link { background: #eff6ff !important; color: #2563eb !important; border-left: 4px solid #2563eb !important; font-weight: bold; }
        #login-overlay { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .page { display: none; }
        .page.active { display: block; }
        #main-content { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row p-2 md:p-4 gap-4">
    <div id="login-overlay">
        <div class="text-center p-10 glass-panel shadow-2xl border-2 border-blue-50">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-bolt text-3xl text-white"></i></div>
            <h1 class="text-xl font-black mb-1 text-gray-800">AISIGNALFX ACCESS</h1>
            <p class="text-[10px] text-gray-400 mb-6 uppercase tracking-widest font-bold">Premium Neural v10.5</p>
            <div id="main-content" class="w-full flex flex-col md:flex-row gap-4">
        <aside class="w-full md:w-64 glass-panel flex md:flex-col p-4 bg-white border-r">
            <div class="hidden md:flex items-center gap-2 mb-8 text-blue-600 px-2 font-black uppercase"><i class="fas fa-microchip"></i> AiSignalFx</div>
            <nav class="flex md:flex-col w-full gap-2">
                <div onclick="showPage('page-dashboard', this)" class="nav-item active-link p-3 rounded-lg flex items-center gap-3 cursor-pointer"><i class="fas fa-chart-line text-sm"></i><span class="text-xs font-bold uppercase">Dashboard</span></div>
                <div onclick="showPage('page-history', this)" class="nav-item p-3 rounded-lg flex items-center gap-3 text-gray-400 hover:bg-gray-50 cursor-pointer"><i class="fas fa-history text-sm"></i><span class="text-xs font-bold uppercase">History</span></div>
                <div onclick="showPage('page-billing', this)" class="nav-item p-3 rounded-lg flex items-center gap-3 text-gray-400 hover:bg-gray-50 cursor-pointer"><i class="fas fa-wallet text-sm"></i><span class="text-xs font-bold uppercase">Billing</span></div>
            </nav>
            <div class="mt-auto pt-4 border-t flex items-center gap-3">
                <img id="user-pic" src="" class="w-8 h-8 rounded-full border-2 border-blue-500 bg-gray-100">
                <div class="overflow-hidden"><p id="user-name" class="text-[10px] font-black truncate text-gray-700">User</p><p class="text-[8px] text-green-500 font-bold uppercase">Pro Member</p></div>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto space-y-4 pb-20 md:pb-0">
            <div id="page-dashboard" class="page active space-y-4">
                <div class="glass-panel p-2 bg-white h-[450px] md:h-[500px]" id="tv_chart_container"></div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="glass-panel p-4 bg-white border-l-4 border-blue-500"><p class="text-[9px] text-gray-400 font-black uppercase">Signal</p><h4 id="web-signal" class="text-lg font-black text-blue-600 uppercase">Scanning...</h4></div>
                    <div class="glass-panel p-4 bg-white border-l-4 border-green-500"><p class="text-[9px] text-gray-400 font-black uppercase">XAUUSD Price</p><h4 id="web-price" class="text-lg font-black text-gray-700">$0.00</h4></div>
                    <div class="glass-panel p-4 bg-white border-l-4 border-orange-500"><p class="text-[9px] text-gray-400 font-black uppercase">Trend</p><h4 id="web-zone" class="text-lg font-black text-gray-700 uppercase">Neutral</h4></div>
                </div>
            </div>
            <div id="page-history" class="page glass-panel p-6 bg-white"><h3 class="font-black text-gray-700 border-b pb-3 mb-4 uppercase text-xs">Recent Trades</h3><div id="history-list" class="space-y-3"></div></div>
            <div id="page-billing" class="page glass-panel p-8 bg-white border">
                <h3 class="font-black text-lg mb-6 uppercase">Subscription</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="p-6 border-2 border-blue-500 rounded-2xl bg-blue-50 text-center"><h4 class="font-black text-blue-600">VIP ACCESS</h4><p class="text-2xl font-black my-4">Rp 150.000 <span class="text-[10px] font-normal">/30 Hari</span></p><button class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-[10px] uppercase">Upgrade Now</button></div>
                    <div class="p-6 border rounded-2xl bg-gray-50"><h4 class="font-black text-[10px] uppercase mb-4 text-gray-400">Metode Pembayaran</h4><div class="space-y-2 text-[10px]"><div class="flex justify-between p-2 bg-white border rounded"><span>DANA/OVO</span><span class="font-bold">08XX-XXXX-XXXX</span></div><div class="flex justify-between p-2 bg-white border rounded"><span>QRIS</span><span class="font-bold">Check Admin</span></div></div></div>
                </div>
            </div>
        </main>
    </div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        function handleCredentialResponse(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            document.getElementById('user-name').innerText = data.name;
            document.getElementById('user-pic').src = data.picture;
            initDashboard();
        }
        window.onload = function () {
            google.accounts.id.initialize({ client_id: "721665427388-7m47k56r09a06hpt8m6q7u9594n907u0.apps.googleusercontent.com", callback: handleCredentialResponse });
            google.accounts.id.renderButton(document.getElementById("buttonDiv"), { theme: "outline", size: "large" });
        };
        function showPage(pId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-link'));
            el.classList.add('active-link');
            if(pId === 'page-history') fetchHistory();
        }
        function initDashboard() {
            new TradingView.widget({"autosize": true, "symbol": "OANDA:XAUUSD", "interval": "15", "theme": "light", "style": "1", "container_id": "tv_chart_container"});
            setInterval(fetchLive, 4000);
        }
        const DB = "https://ai-signalfx-default-rtdb.asia-southeast1.firebasedatabase.app/";
        async function fetchLive() {
            try {
                const res = await fetch(DB + "signal.json");
                const d = await res.json();
                if(d) {
                    document.getElementById('web-signal').innerText = d.signal;
                    document.getElementById('web-price').innerText = d.price;
                    document.getElementById('web-zone').innerText = d.trend;
                }
            } catch (e) {}
        }
        async function fetchHistory() {
            try {
                const res = await fetch(DB + "history.json");
                const d = await res.json();
                if(d) {
                    let h = "";
                    Object.values(d).reverse().slice(0, 10).forEach(v => {
                        h += `<div class="p-3 bg-gray-50 border rounded-lg flex justify-between items-center text-[10px]"><div><b>${v.signal}</b><br>${v.time}</div><div class="text-right"><b>${v.price}</b><br>${v.type}</div></div>`;
                    });
                    document.getElementById('history-list').innerHTML = h;
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
            <div id="buttonDiv"></div>
        </div>
    </div>
