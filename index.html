<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI SIGNALFX</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 20px; width: 90%; max-width: 400px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.5rem; color: #8b949e; letter-spacing: 3px; margin-bottom: 10px; }
        .time { font-size: 0.9rem; color: #58a6ff; margin-bottom: 20px; }
        .price { font-size: 4rem; font-weight: bold; color: #ffffff; margin: 20px 0; font-family: monospace; }
        .signal { width: 100%; padding: 20px; border-radius: 15px; font-size: 2rem; font-weight: 900; background: #30363d; margin-bottom: 20px; }
        .buy { background: #238636; box-shadow: 0 0 20px rgba(35,134,54,0.4); }
        .sell { background: #da3633; box-shadow: 0 0 20px rgba(218,54,51,0.4); }
        .footer { display: flex; justify-content: space-between; border-top: 1px solid #30363d; padding-top: 15px; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>AI SIGNALFX</h1>
        <div id="time" class="time">MENGHUBUNGKAN...</div>
        <div id="price" class="price">0.00</div>
        <div id="signal" class="signal">WAIT</div>
        <div class="footer">
            <div style="color: #ff7b72;">SL: <span id="sl">0</span></div>
            <div style="color: #3fb950;">TP: <span id="tp">0</span></div>
        </div>
    </div>
    <script>
        async function load() {
            try {
                const r = await fetch('/api/index');
                const d = await r.json();
                document.getElementById('price').innerText = d.price || "0.00";
                document.getElementById('time').innerText = (d.time || "--") + " WIB";
                document.getElementById('sl').innerText = d.sl || "0";
                document.getElementById('tp').innerText = d.tp || "0";
                const s = document.getElementById('signal');
                s.innerText = d.signal || "WAIT";
                s.className = 'signal ' + (String(d.signal).includes('BUY') ? 'buy' : 'sell');
            } catch (e) { document.getElementById('price').innerText = "OFFLINE"; }
        }
        setInterval(load, 3000); load();
    </script>
</body>
</html>
