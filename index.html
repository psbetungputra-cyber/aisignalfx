<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiSignalFx NeuroPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #ffffff; color: #1e293b; font-family: 'Inter', sans-serif; margin: 0; }
        .panel { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; }
        .spin { animation: rotate 2s linear infinite; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen p-2 md:p-4 gap-4">
    <aside class="w-full md:w-64 panel p-4 flex md:flex-col justify-around md:justify-start gap-4 h-fit md:h-full">
        <div class="hidden md:block font-bold text-blue-600 text-xl mb-6 italic">AISIGNALFX</div>
        <nav class="flex md:flex-col gap-2 w-full">
            <div class="p-2 bg-blue-50 text-blue-600 rounded-lg font-bold text-xs flex items-center gap-2"><i class="fas fa-th-large"></i> DASHBOARD</div>
            <div class="p-2 text-gray-400 font-bold text-xs flex items-center gap-2"><i class="fas fa-broadcast-tower"></i> SIGNALS</div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col gap-4 overflow-y-auto">
        <header class="flex justify-between items-center px-1">
            <div class="font-bold text-gray-700">NEUROPRO <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded">V9.5</span></div>
            <div id="clock" class="text-[10px] font-mono text-gray-400 bg-gray-50 px-2 py-1 rounded border">00:00:00 MDT</div>
        </header>

        <div class="panel p-4 flex-1 flex flex-col min-h-[400px] relative bg-white">
            <div class="flex justify-between text-[10px] font-bold text-gray-400 uppercase mb-2">
                <span>Live Analysis</span>
                <span class="text-blue-500 italic">● PAXG-USD LIVE</span>
            </div>
            <div id="chart-container" class="flex-1 w-full rounded-lg"></div>
            
            <div class="absolute bottom-4 right-4 bg-white/80 backdrop-blur p-2 border rounded-md shadow-sm z-10">
                <div class="text-[9px] font-bold text-gray-400 flex items-center gap-2">
                    <i class="fas fa-circle-notch spin text-blue-500"></i> SCANNING...
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="panel p-4">
                <div class="text-[10px] font-bold text-gray-400 mb-2">LAST SIGNAL</div>
                <div class="p-2 bg-blue-50 border border-blue-100 rounded text-xs font-bold flex justify-between">
                    <span>PAXG-USD</span> <span class="text-blue-600">STRONG BUY</span>
                </div>
            </div>
            <div class="panel p-4 h-20 overflow-hidden text-[10px] font-mono text-gray-400" id="logs"></div>
        </div>
    </main>
        <script>
        // 1. JAM & LOGS
        function startUI() {
            setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB') + " MDT";
            }, 1000);

            const msg = ["Analyzing Liquidity...", "Order Block found", "Neural scan: 94%"];
            setInterval(() => {
                const l = document.getElementById('logs');
                const p = document.createElement('p');
                p.innerHTML = ">> " + msg[Math.floor(Math.random()*msg.length)];
                l.appendChild(p);
                if(l.children.length > 3) l.removeChild(l.children[0]);
            }, 3000);
        }

        // 2. MESIN GRAFIK (FIXED)
        function loadChart() {
            const container = document.getElementById('chart-container');
            if(!container) return;

            // Paksa ukuran agar tidak 0
            const w = container.clientWidth;
            const h = container.clientHeight || 380;

            const chart = LightweightCharts.createChart(container, {
                width: w,
                height: h,
                layout: { backgroundColor: '#ffffff', textColor: '#64748b' },
                grid: { vertLines: { color: '#f1f5f9' }, horzLines: { color: '#f1f5f9' } },
                rightPriceScale: { borderColor: '#e2e8f0' },
                timeScale: { borderColor: '#e2e8f0' },
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#2563eb', downColor: '#f43f5e', 
                borderVisible: false, wickUpColor: '#2563eb', wickDownColor: '#f43f5e'
            });

            // Data Dummy
            const data = [
                { time: '2026-05-01', open: 4640, high: 4645, low: 4638, close: 4642 },
                { time: '2026-05-02', open: 4642, high: 4648, low: 4640, close: 4646 },
                { time: '2026-05-03', open: 4646, high: 4647, low: 4642, close: 4643 },
                { time: '2026-05-04', open: 4643, high: 4650, low: 4643, close: 4648 },
                { time: '2026-05-05', open: 4648, high: 4655, low: 4647, close: 4652 }
            ];
            candleSeries.setData(data);

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth });
            });
        }

        // JALANKAN SETELAH SEMUA LOAD
        window.onload = () => {
            startUI();
            // Kasih jeda sedikit agar container siap
            setTimeout(loadChart, 500);
        };
    </script>
</body>
</html>
