<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SIGNALFX</title>
    <style>
        body { background: #0b0e14; color: #e6edf3; font-family: sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: #161b22; border: 2px solid #30363d; border-radius: 20px; width: 90%; max-width: 380px; padding: 25px; text-align: center; }
        .price { font-size: 4.5rem; font-weight: bold; color: #ffffff; margin: 20px 0; font-family: monospace; }
        .signal { width: 100%; padding: 20px 0; border-radius: 15px; font-size: 2.2rem; font-weight: 900; background: #30363d; margin-bottom: 20px; }
        .buy { background: #238636 !important; }
        .sell { background: #da3633 !important; }
        .footer { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; border-top: 1px solid #30363d; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="font-size: 1.5rem; color: #8b949e;">AI SIGNALFX</h1>
        <div id="time" style="color: #58a6ff; font-size: 0.9rem;">CONNECTING...</div>
        <div id="price" class="price">0.00</div>
        <div id="signal" class="signal">WAIT</div>
        <div class="footer">
            <div style="color: #ff7b72;">SL: <span id="sl">0</span></div>
            <div style="color: #3fb950;">TP: <span id="tp">0</span></div>
        </div>
    </div>
    <script>
        async function up() {
            try {
                const r = await fetch('/api/index');
                const d = await r.json();
                document.getElementById('price').innerText = d.price;
                document.getElementById('time').innerText = d.time + " WIB";
                document.getElementById('sl').innerText = d.sl;
                document.getElementById('tp').innerText = d.tp;
                const s = document.getElementById('signal');
                s.innerText = d.signal;
                s.className = 'signal ' + (String(d.signal).includes('BUY') ? 'buy' : 'sell');
            } catch (e) { }
        }
        setInterval(up, 3000); up();
    </script>
</body>
</html>
