<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- LOCK DESKTOP MODE: Biar di HP tetap lebar & pro -->
    <meta name="viewport" content="width=1280">
    <title>AI SIGNALFX - Professional Trading Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #05070a;
            --panel-dark: #0f172a;
            --wa-bubble: #1e293b;
        }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            min-width: 1280px;
            overflow-x: auto;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Style Chat WhatsApp */
        .chat-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 12px;
            position: relative;
            margin-bottom: 4px;
        }
        .bubble-left {
            background: var(--wa-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .bubble-right {
            background: #1e3a8a;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        /* Scrollbar Halus */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-6">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-black italic text-blue-500 tracking-tighter">AI SIGNALFX</h1>
        <div class="flex gap-4">
            <button onclick="switchPage('dashboard')" class="text-xs font-bold uppercase hover:text-blue-400">Dashboard</button>
            <button onclick="switchPage('visual-ai')" class="text-xs font-bold uppercase hover:text-blue-400">Visual AI</button>
            <button onclick="switchPage('autoscan')" class="text-xs font-bold uppercase hover:text-blue-400 text-amber-500">VIP Autoscan</button>
        </div>
    </div>

    <!-- MAIN TERMINAL (NEUTRAL LAYOUT) -->
    <main class="max-w-[1200px] mx-auto space-y-6">
        
        <!-- 1. TRADINGVIEW FULL WIDTH -->
        <div class="glass-panel rounded-3xl overflow-hidden h-[600px] shadow-2xl border-blue-500/20">
            <!-- Replace with your actual TradingView Widget Code -->
            <div id="tradingview_widget" class="w-full h-full"></div>
        </div>

        <!-- 2. SENTIMEN PASAR -->
        <div class="glass-panel p-5 rounded-2xl">
            <div class="flex justify-between items-end mb-2">
                <span class="text-[10px] font-black text-blue-400 uppercase tracking-widest">Market Sentiment</span>
                <span class="text-[10px] font-bold text-white" id="sentiment-label">70% BULLISH</span>
            </div>
            <div class="w-full h-2 bg-gray-800 rounded-full overflow-hidden flex">
                <div id="bull-bar" class="bg-green-500 shadow-[0_0_10px_#22c55e]" style="width: 70%"></div>
                <div id="bear-bar" class="bg-red-500 shadow-[0_0_10px_#ef4444]" style="width: 30%"></div>
            </div>
        </div>

        <!-- 3. DYNAMIC CONTENT AREA (Visual AI / Info) -->
        <div id="dynamic-content" class="hidden glass-panel p-6 rounded-3xl border-amber-500/30">
            <!-- Sinyal & Konfirmasi muncul di sini sesuai menu yang dipilih -->
        </div>

        <!-- 4. COMMUNITY MAPPING (WhatsApp Style) -->
        <div class="glass-panel rounded-3xl p-6">
            <h3 class="text-xs font-bold uppercase mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span> Community Mapping
            </h3>
            
            <div id="chat-box" class="flex flex-col space-y-4 h-[400px] overflow-y-auto pr-4">
                <!-- Chat Bubbles -->
                <div class="chat-bubble bubble-left">
                    <p class="font-bold text-blue-400 text-[10px] mb-1">GUEST TRADER</p>
                    <p>Guys, Gold H1 ada potensi BOS ke atas nggak ya?</p>
                    <div class="flex justify-end mt-1 gap-3 text-[9px] text-gray-500">
                        <span>Like</span><span>Reply</span><span>02:05 AM</span>
                    </div>
                </div>
            </div>

            <!-- INPUT AREA -->
            <div class="mt-6 flex gap-3">
                <input type="text" placeholder="Type analysis..." class="flex-1 bg-slate-800 border-none rounded-full px-5 text-sm focus:ring-2 focus:ring-blue-500">
                <button class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-full text-xs font-bold uppercase transition">Send</button>
                <button onclick="triggerUpload()" class="bg-green-600 hover:bg-green-500 px-6 py-2 rounded-full text-xs font-bold uppercase transition">Upload Chart</button>
            </div>
        </div>

    </main>

    <script>
        // Logika Switch Menu & Sinyal di Masing-masing tempat
        function switchPage(page) {
            const dynamic = document.getElementById('dynamic-content');
            dynamic.classList.remove('hidden');
            
            if(page === 'visual-ai') {
                dynamic.innerHTML = `
                    <h2 class="text-amber-500 font-bold mb-2 uppercase text-xs">Visual AI Analysis Result</h2>
                    <div class="grid grid-cols-3 gap-4 mb-4">
                        <div class="bg-black/30 p-3 rounded-xl border border-white/5"><p class="text-[10px] text-gray-400">ENTRY</p><p class="font-bold text-green-400">2345.10</p></div>
                        <div class="bg-black/30 p-3 rounded-xl border border-white/5"><p class="text-[10px] text-gray-400">SL</p><p class="font-bold text-red-400">2340.00</p></div>
                        <div class="bg-black/30 p-3 rounded-xl border border-white/5"><p class="text-[10px] text-gray-400">TP</p><p class="font-bold text-blue-400">2360.00</p></div>
                    </div>
                    <p class="text-[11px] leading-relaxed text-gray-300"><b class="text-white">KONFIRMASI:</b> Visual scan mendeteksi Bullish Engulfing pada area Demand H1 disertai lonjakan volume institusi.</p>
                `;
            } else if(page === 'autoscan') {
                dynamic.innerHTML = `
                    <h2 class="text-blue-400 font-bold mb-2 uppercase text-xs">VIP AI System Bot Signal</h2>
                    <div class="grid grid-cols-3 gap-4 mb-4">
                        <div class="bg-blue-500/10 p-3 rounded-xl border border-blue-500/30"><p class="text-[10px] text-gray-400">AUTO ENTRY</p><p class="font-bold text-white">2348.50</p></div>
                        <div class="bg-blue-500/10 p-3 rounded-xl border border-blue-500/30"><p class="text-[10px] text-gray-400">AUTO SL</p><p class="font-bold text-white">2342.00</p></div>
                        <div class="bg-blue-500/10 p-3 rounded-xl border border-blue-500/30"><p class="text-[10px] text-gray-400">AUTO TP</p><p class="font-bold text-white">2370.00</p></div>
                    </div>
                    <p class="text-[11px] leading-relaxed text-gray-300"><b class="text-white">ALASAN:</b> Smart Money Concept (SMC) mendeteksi Unmitigated Order Block pada M15 dengan Break of Structure (BOS) yang valid.</p>
                `;
            } else {
                dynamic.classList.add('hidden');
            }
        }

        function triggerUpload() {
            alert("Silahkan pilih screenshot chart lo untuk di-scan AI!");
        }
    </script>
</body>
</html>
