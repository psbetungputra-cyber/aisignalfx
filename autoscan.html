<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SIGNALFX - Autoscan VIP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">AISIGNALFX</div>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="autoscan.html" class="active">AI Autoscan (VIP)</a>
                <a href="visual-ai.html">Visual AI</a>
                <a href="community.html">Community</a>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h2>AI AUTOSCAN COMMAND CENTER</h2>
                <div class="user-info">Logged-In: <span class="user-badge">GU</span></div>
            </header>

            <div class="status-panel">
                <p id="status-text">STATUS ANALYSIS: SYNCHRONIZING (1/100)...</p>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>

            <div class="terminal-container">
                <h3>ANALYSIS LOGS</h3>
                <div id="analysis-log" class="log-screen">
                    [12:05] Initializing CCXT connection...<br>
                    [12:06] Fetching XAUUSD real-time data...<br>
                    [12:07] Waiting for market shift...
                </div>
            </div>

            <div class="risk-control">
                <h3>RISK CALCULATOR</h3>
                <input type="number" id="equity" placeholder="Enter Equity ($)">
                <button onclick="calculateRisk()">Calculate Lot</button>
            </div>
        </main>
    </div>
</body>
</html>
